<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Juno2 standalone frontend validation. Synthetic data and mock responses only; final product name JUNO." />
    <title>Juno2 — synthetic frontend validation</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
  </head>
  <body>
    <div id="root">
      <!-- React replaces this notice when it mounts. Keep it independent of
           JavaScript/CSS assets so a blocked entry cannot leave a blank page. -->
      <section aria-label="Juno2 startup" style="max-width: 38rem; margin: 4rem auto; padding: 2rem; font-family: system-ui, sans-serif; color: #292333; background: #f6f2ea; border-radius: 1rem">
        <h1>Loading Juno2…</h1>
        <p>Synthetic frontend preview only. No student accounts or production APIs.</p>
        <p>If this notice stays visible, the React application has not loaded. Refresh this page. If the notice remains, the demo assets could not load; this is not a working conversation session.</p>
        <noscript><p>JavaScript is disabled in this browser or preview. Enable JavaScript to open Juno2.</p></noscript>
      </section>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
